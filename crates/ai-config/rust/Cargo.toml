[package]
name = "ai-config-a2r"
version = "0.1.0"
edition = "2021"
description = "ai-config — Auto-transpiled from .at (a2r→Rust). Shared AI config + canonical wire types."

# Standalone assembly of transpiled files, kept out of the parent auto-ai
# workspace. The authoritative source is the sibling src/*.at; this rust/ tree
# is the a2r product.
#
# ⚠️ STALE RELATIVE TO rust-ref/: rust-ref/ is the workspace's ACTIVE
# implementation and holds the Plan 381 serde migration (auto-val Deserialize +
# lenient_* helpers) and later fixes (e.g. provider deserialize errors now
# propagate instead of silently skipping). This transpiled tree is generated
# from src/*.at and does NOT reflect any of that — its loader/role_config still
# use the old opt_* style. The planned switch to this tree (auto-ai Plan 016
# §4.6) must account for the divergence before flipping the [lib] path.
[workspace]

[lib]
name = "ai_config_a2r"
path = "src/lib.rs"

[dependencies]
# atom (.at) parsing + value bridging live in the sibling auto-lang repo.
# ai-config uses `use.rust auto_atom` / `use.rust auto_val`, which a2r renders
# as direct external-crate `use` statements (no shim needed).
a2r-std = { path = "../../../../auto-lang/crates/a2r-std" }
auto-atom = { path = "../../../../auto-lang/crates/auto-atom" }
auto-val = { path = "../../../../auto-lang/crates/auto-val", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dirs = "5"
