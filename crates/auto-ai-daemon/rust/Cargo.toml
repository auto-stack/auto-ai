[package]
name = "auto-ai-daemon-a2r"
version = "0.1.0"
edition = "2021"
description = "auto-ai-daemon — Auto-transpiled from .at (a2r→Rust). HTTP server layer uses axum/tokio directly via use.rust (Plan 025)."

# Keep this crate OUT of the parent auto-ai workspace (standalone assembly).
[workspace]

[lib]
name = "auto_ai_daemon_a2r"
path = "src/lib.rs"

[[bin]]
name = "aaid-a2r"
path = "src/main.rs"

[dependencies]
# a2r runtime + atom/val bridging (auto-lang sibling crates).
a2r-std = { path = "../../../../auto-lang/crates/a2r-std" }
auto-atom = { path = "../../../../auto-lang/crates/auto-atom" }
auto-val = { path = "../../../../auto-lang/crates/auto-val", features = ["serde"] }

# Real Rust crates — ai-config (shared wire types + config parsing).
ai-config = { path = "../../ai-config" }

# Framework crates used directly via `use.rust` from .at (Plan 025 approach).
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
url = "2"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
